<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Eterna Custom Chromecast Receiver</title>
  <!-- Load Google Cast Receiver SDK (CAF) -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf/v3/cast_receiver_framework.js"></script>
  <!-- Cast Receiver UI dark theme stylesheet -->
  <link rel="stylesheet" href="//www.gstatic.com/cast/sdk/libs/caf/v3/theme/dark.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000000;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }
    cast-media-player {
      width: 100vw;
      height: 100vh;
    }
    /* Simple decorative brand overlay on Chromecast receiver */
    #eterna-brand {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: rgba(9, 14, 30, 0.8);
      border: 1px solid rgba(0, 217, 255, 0.3);
      padding: 8px 16px;
      border-radius: 8px;
      color: #00D9FF;
      font-family: monospace;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1.5px;
      z-index: 1000;
      box-shadow: 0 0 15px rgba(0, 217, 255, 0.2);
    }
  </style>
</head>
<body>
  <div id="eterna-brand">ETERNA STREAMING CORE // Chromecast</div>
  <cast-media-player></cast-media-player>
  <script type="module" src="/src/receiver.ts"></script>
</body>
</html>
